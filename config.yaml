# ==========================================
# Cấu hình hệ thống ALPR cho Raspberry Pi 5
# ==========================================

device: "cpu"

# Module phát hiện biển số (YOLO NCNN)
detector:
  model_path: "models/lp_det/best_ncnn_model"
  conf_threshold: 0.35
  iou_threshold: 0.45
  imgsz: 640

# Module theo dõi đối tượng (ByteTrack qua supervision)
tracker:
  track_activation_threshold: 0.3
  lost_track_buffer: 30
  minimum_matching_threshold: 0.8
  skip_frames: 3              # Chạy YOLO mỗi 3 frames (1, 4, 7...) để tối ưu FPS trên Pi 5

# Module nhận diện ký tự (PaddleOCR ONNX Runtime sử dụng model trong thư mục models/)
ocr:
  engine: "onnxruntime"
  lang: "en"
  det_model_name: "PP-OCRv6_tiny_det"
  rec_model_name: "PP-OCRv6_tiny_rec"
  det_model_dir: "models/ch_det"
  rec_model_dir: "models/ch_rec"
  use_angle_cls: false
  min_confidence: 0.5
  max_retry_per_track: 3      # Số lần thử OCR tối đa nếu ảnh ban đầu mờ trước khi chốt

# Cấu hình xuất kết quả & hiển thị
output:
  save_result: true
  output_dir: "outputs"
  show_live: false            # Set true nếu Raspberry Pi 5 có gắn màn hình HDMI
