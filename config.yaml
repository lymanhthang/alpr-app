# ==========================================
# Cấu hình hệ thống ALPR cho Raspberry Pi 5
# ==========================================

device: "cpu"

# Module phát hiện biển số (YOLO NCNN)
detector:
  model_path: "models/lp_det/384x640_fp16_ncnn_model"
  conf_threshold: 0.1
  iou_threshold: 0.1
  imgsz: 640

# Module phân loại 14 loại xe 2 bánh Việt Nam (YOLO NCNN)
vehicle_classifier:
  enabled: false # Bật qua CLI bằng --classify-vehicle hoặc đổi thành true
  model_path: "models/vehicle_classify/384x640_fp16_ncnn_model"
  conf_threshold: 0.35
  iou_threshold: 0.45
  imgsz: [384, 640]
  skip_frames: 2 # Bỏ qua frame cho phân loại xe (chạy cùng nhịp với detector)
  draw_box: true # Hiển thị bounding box thân xe kèm loại xe
  strategy: "voting" # Chiến lược phân loại: "voting" (bỏ phiếu đa frame) hoặc "lock_first" (khóa loại xe ngay lần đầu)
  lock_first_conf: 0.5 # Ngưỡng tin cậy để khóa ngay lần đầu khi dùng strategy "lock_first"

# Module theo dõi đối tượng (ByteTrack qua Ultralytics YOLO / supervision)
tracker:
  track_activation_threshold: 0.3
  lost_track_buffer: 30
  minimum_matching_threshold: 0.8
  skip_frames: 0 # Số frame bỏ qua giữa các lần chạy YOLO (0: xử lý mọi frame không bỏ qua; 2: bỏ qua 2 frame, chạy mỗi 3 frames)
  tracker_type: "bytetrack.yaml" # Thuật toán tracking Ultralytics: "bytetrack.yaml" hoặc "botsort.yaml"

# Module nhận diện ký tự & Nâng cao độ tin cậy
ocr:
  engine: "onnxruntime"
  lang: "en"
  det_model_name: "PP-OCRv6_tiny_det"
  rec_model_name: "PP-OCRv6_tiny_rec"
  det_model_dir: "models/ch_det"
  rec_model_dir: "models/ch_rec"
  use_angle_cls: false
  min_confidence: 0.5
  retry_interval_frames: 1 # Bỏ qua 1 frame tiếp theo giữa các lần thử nếu chưa đạt chuẩn VN

  # Chiến lược độ tin cậy
  strategy: "voting" # "voting" (bỏ phiếu đa frame) hoặc "lock_first" (khóa ngay lần đầu)
  use_regex_filter: true
  use_quality_selection: true
  use_char_correction: true
  quality_min_score: 0.35
  max_ocr_per_track: 8
  early_lock_enabled: true
  early_lock_votes: 3
  early_lock_conf: 0.85

# Cấu hình lưu trữ CSDL (SQLite WAL) & Ảnh
storage:
  enabled: true
  db_path: "data/alpr.db"
  crops_dir: "data/crops"
  contexts_dir: "data/contexts"
  clips_dir: "data/clips"
  retention_days: 30
  max_disk_gb: 20.0
  queue_maxsize: 256

# Cấu hình trích xuất clip ngắn (Ring Buffer - tắt mặc định để tối ưu CPU)
clip:
  enabled: false
  pre_seconds: 3.0
  post_seconds: 2.0
  scale: 0.5

# Cấu hình Web API & Tra cứu
api:
  host: "0.0.0.0"
  port: 8000

# Cấu hình xuất kết quả, hiển thị & phát luồng web
output:
  save_result: true
  output_dir: "outputs"
  show_live: false # Set true nếu Raspberry Pi 5 có gắn màn hình HDMI trực tiếp
  web_stream: false # Bật phát luồng video qua Web HTTP để xem trên trình duyệt
  stream_host: "0.0.0.0"
  stream_port: 8080 # Cổng phát luồng Web MJPEG (truy cập: http://<IP_Pi>:8080)
  stream_quality: 80 # Chất lượng nén ảnh JPEG (1-100, 80 tối ưu CPU/độ nét)
